<header>
  <h3>Detalles de Cliente</h3>
  <div
    [style.backgroundColor]="statusIndicator().background"
    [style.color]="statusIndicator().color"
  >
    <lucide-angular size="18" [img]="isOkay() ? CHECK_ICON : WARNING_ICON"></lucide-angular>
    <p>{{ isOkay() ? 'Pago al dia' : 'Pago con demora' }}</p>
  </div>
</header>
<div class="goals-diagnosis">
  <div>
    <h4>diagnóstico clínico</h4>
    <ul>
      @for (diagnosis of diagnosisList; track $index) {
        <li>
          <app-chip-item [color]="GetColorByIndex($index)">{{ diagnosis }}</app-chip-item>
        </li>
      }
    </ul>
  </div>
  <div>
    <h4>objetivos</h4>
    <ul>
      @for (goal of goalList; track $index) {
        <li>
          <app-chip-item [color]="GetColorByIndex($index)">{{ goal }}</app-chip-item>
        </li>
      }
    </ul>
  </div>
</div>
<div class="contact-appointment">
  <div>
    <h4>información de contacto</h4>
    <app-small-info-card
      [color]="GetColorByIndex(0)"
      [icon]="EMAIL_ICON"
      label="Correo Electrónico"
      value="mo@mo.cl"
    ></app-small-info-card>
    <app-small-info-card
      [color]="GetColorByIndex(0)"
      [icon]="PHONE_ICON"
      label="Teléfono"
      value="932421232"
    ></app-small-info-card>
  </div>
  <div>
    <h4>próxima cita</h4>
    <app-small-info-card
      [color]="GetColorByIndex(0)"
      [icon]="PAST_ICON"
      label="Ultima Consulta"
      [value]="parseToString(past)"
    ></app-small-info-card>
    <app-small-info-card
      [color]="GetColorByIndex(2)"
      [icon]="FUTURE_ICON"
      label="Proxima Consulta"
      [value]="parseToString(next)"
    ></app-small-info-card>
  </div>
</div>
<div class="metrics">
  <app-metric-info-card title="estatura" value="162" metric="cm"></app-metric-info-card>
  <app-metric-info-card title="peso actual" value="74" metric="kg"></app-metric-info-card>
  <app-metric-info-card title="IMC" value="23.2"></app-metric-info-card>
  <app-metric-info-card title="grasa corporal" value="23.2" metric="%"></app-metric-info-card>
</div>
<div class="actions">
  <button app-button>Nueva Medición</button>
  <button app-button [isSecondary]="true">
    <lucide-angular [img]="PLUS_ICON" size="20"></lucide-angular>
    <span> Editar Perfil </span>
  </button>
</div>
