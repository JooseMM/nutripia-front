<header>
  <div class="date">
    <p>{{ date | date: 'EEEE, MMMM d' : '' : 'es-ES' | titlecase }}</p>
  </div>
  <h1>¡Qué bueno verte de nuevo, <span>{{ firstname() }}</span>!</h1>
  <p>
    Tienes 8 consultas programadas para hoy. 3 pacientes han alcanzado sus metas de macros esta
    semana.
  </p>
</header>
<div class="cards">
  <div class="metrics">
    <h3 class="cards__title">Resumen</h3>
    <app-metrics-card
      [icon]="USERS"
      iconBackground="#675784"
      [improvementPercentage]="+22"
      title="cantidad de clientes"
      [value]="10"
    ></app-metrics-card>
    <app-metrics-card
      [icon]="CALENDAR"
      iconBackground="#282828"
      [improvementPercentage]="-12"
      title="citas nutricionales"
      [value]="5"
    ></app-metrics-card>
  </div>
  <div class="appointments">
    <h3 class="cards__title">Próxima Cita</h3>
    <app-calendar-card appointmentOwner="Juanete Perez" [appointment]="appointmentList[0]"></app-calendar-card>
  </div>
</div>
