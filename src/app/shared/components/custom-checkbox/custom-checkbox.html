<label class="round-check">
  <input
    type="checkbox"
    class="round-check__input"
    [checked]="value"
    [disabled]="disabled"
    (change)="onToggle($event)"
    (blur)="onTouched()"
  />
  <span class="round-check__circle"></span>
  <span class="round-check__label">{{ label() }}</span>
</label>
