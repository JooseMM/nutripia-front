<div>
  <label [for]="id()">{{ label() }}</label>
  <input
    [id]="id()"
    [type]="type()"
    class="field__input"
    [class.invalid]="isInvalid()"
    [placeholder]="placeholder()"
    [value]="value"
    (input)="onInput($event)"
    (blur)="onBlur()"
    (focus)="onFocus()"
    [value]="value"
  />
  @if (isInvalid() && !focus()) {
    <small>{{ errorMessage() }}</small>
  }
</div>
