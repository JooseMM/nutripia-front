<header>
  <div class="date">
    <p>{{ date | date: 'EEEE, MMMM d' : '' : 'es-ES' | titlecase }}</p>
  </div>
  <h1>
    ¡Qué bueno verte de nuevo, <span>{{ firstname() }}</span
    >!
  </h1>
</header>
<div class="cards">
  <app-metrics-card
    [icon]="USERS"
    iconBackground="#675784"
    iconColor="#FFF"
    [improvementPercentage]="
      calculatePorcentageChange(
        performanceResume?.previousClientCount,
        performanceResume?.currentClientCount
      )
    "
    title="cantidad de clientes este mes"
    [value]="performanceResume?.currentAppointmentCount"
  ></app-metrics-card>
  <app-metrics-card
    [icon]="CALENDAR"
    iconColor="#673E59"
    iconBackground="#FFC7E9"
    [improvementPercentage]="
      calculatePorcentageChange(
        performanceResume?.previousAppointmentCount,
        performanceResume?.currentAppointmentCount
      )
    "
    title="citas nutricionales este mes"
    [value]="performanceResume?.currentAppointmentCount"
  ></app-metrics-card>
  <app-calendar-card
    class="card__calendar"
    [appointment]="performanceResume?.appointmentResume"
  ></app-calendar-card>
  <app-todo-list class="card__todo" [taskList]="taskList()"></app-todo-list>
</div>
