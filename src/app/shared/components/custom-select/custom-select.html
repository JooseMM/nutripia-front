<div>
  <label [for]="id()">{{ label() }}</label>
  <select
    [id]="id()"
    class="field__input"
    [class.invalid]="isInvalid()"
    [value]="value"
    (change)="onSelect($event)"
    (blur)="onBlur()"
    (focus)="onFocus()"
    [value]="value"
  >
    @for (opt of options(); track opt.id) {
      <option [id]="opt.id">{{ opt.value }}</option>
    }
  </select>
  @if (isInvalid() && !focus()) {
    <small>{{ errorMessage() }}</small>
  }
</div>
