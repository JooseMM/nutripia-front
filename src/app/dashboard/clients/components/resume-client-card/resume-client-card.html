<div class="basic-info">
  <div class="profile-picture">
    @if (!userProfileImage()) {
      <lucide-angular [img]="USER_ICON" size="30"></lucide-angular>
    } @else {
      <img [src]="userProfileImage()" />
    }
  </div>
  <div class="info">
    <p class="info__fullname">{{ fullname() }}</p>
    <p class="info__age">{{ age() }} años</p>
  </div>
</div>
