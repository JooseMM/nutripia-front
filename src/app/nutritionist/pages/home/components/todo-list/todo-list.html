<ul [style.placeContent]="'center'">
  @for (task of taskList(); track task.id) {
    <li
      [class.border-bottom]="!$last"
      [class.completed]="task.isCompleted"
      (click)="toggleCompletion($index)"
    >
      <div class="check__indicator">
        <lucide-angular class="check" [img]="CHECK" size="20"></lucide-angular>
      </div>
      <div class="content">
        <p class="content__title">Revision de plan nutricional</p>
        <p class="content__description">Terminar las recomendaciones de snacks</p>
      </div>
      <div class="options">
        <lucide-angular [img]="OPTIONS"></lucide-angular>
      </div>
    </li>
  } @empty {
    <li class="empty">
      <div>
        <lucide-angular [img]="EMPTY" size="40"></lucide-angular>
      </div>
      <p>No hay tareas pendientes</p>
      <button app-button [isSecondary]="true">AGREGAR</button>
    </li>
  }
</ul>
