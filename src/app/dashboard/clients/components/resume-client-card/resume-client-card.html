<div class="basic-info">
  <div class="profile-picture">
    <lucide-angular [img]="USER_ICON" size="30"></lucide-angular>
  </div>
  <div class="info">
    <p class="info__fullname">{{ fullname() }}</p>
    <p class="info__age">{{ age() }} años</p>
  </div>
</div>
@if (isSelected()) {
  <div class="tracking-info">
    <app-info-card title="last visit" value="Oct 12, 2023"></app-info-card>
    <app-info-card title="Cambio de peso" value="-12kg"></app-info-card>
  </div>
}
