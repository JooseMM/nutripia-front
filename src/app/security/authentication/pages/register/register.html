<main>
  <div class="image_container">
    <a routerLink="/home" class="logo_container"><app-logo></app-logo></a>
    <div class="image__title">
      <h3>NutriPia</h3>
      <p>Tu camino hacia una vida más saludable comienza aquí.</p>
    </div>
  </div>
  <div class="content_container">
    <a routerLink="/authentication/login" class="option_container"
      >¿Ya tienes cuenta? <b>Inicia sesión</b></a
    >
    <div class="content__title">
      <h1>Crea tu cuenta</h1>
      <p>Únete a nuestra comunidad y empieza tu transformación.</p>
    </div>
    <form [formGroup]="form">
      <app-custom-input label="Primer nombre" placeholder="ejem: Juan"></app-custom-input>
      <app-custom-input label="Primer apellido" placeholder="ejem: Perez"></app-custom-input>
      <app-custom-input
        label="Correo Electrónico"
        placeholder="ejem: cesar.andrade@correo.com"
      ></app-custom-input>
      <app-custom-input
        label="Fecha de nacimiento"
        type="date"
        placeholder="ejem: 2000-01-01"
      ></app-custom-input>
      <app-custom-input label="RUT" placeholder="ejem: 22.222.222-2"></app-custom-input>
      <app-custom-input label="Contraseña" placeholder="●●●●●●●●●●●●●●●●●●●●"></app-custom-input>
      <app-custom-input
        label="Confirmar contraseña"
        placeholder="●●●●●●●●●●●●●●●●●●●●"
      ></app-custom-input>
    </form>

    <div class="actions">
      <app-custom-checkbox
        label="Acepto los Términos y Condiciones así como la Política de Privacidad."
      ></app-custom-checkbox>
      <app-button>Crear Cuenta</app-button>
    </div>
  </div>
</main>
